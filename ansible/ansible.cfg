# ============================================================
# ansible/ansible.cfg —— 只保留生效项
#
#   注意：pipelining / ssh_args / control_path 必须写在 [ssh_connection] 段；
#         写在别的段里 Ansible 不报错，但完全不生效。
#   下面的 /root/... 都是**容器内**路径：宿主机的 $HOME/.ssh 被映射到容器的 /root/.ssh
#   （容器里始终以 root 运行），所以非 root 用户也能正常使用。
#   容器内 /root/.ssh 为只读挂载，所以多路复用套接字放在可写目录
#   /var/run/ansible-cp（run.sh 会创建该映射目录）。
#   run_playbook.sh 显式 export ANSIBLE_CONFIG 指向本文件，不依赖 cwd 自动发现。
#
#   设计理由与验证方式见 docs/DESIGN.md 3.6
# ============================================================
[defaults]
bin_ansible_callbacks = True
stdout_callback = yaml
display_skipped_hosts = False
fact_caching = memory
host_key_checking = False
remote_user = root
private_key_file = /root/.ssh/id_rsa_ansible
forks = 20

[privilege_escalation]
become = True

[ssh_connection]
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s
control_path = /var/run/ansible-cp/ansible-%%r@%%h:%%p
